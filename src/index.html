<script>
    const tools = [
      { id: "lrc", name: "LRC歌詞エディター", file: "tools/lrc-tagger.html" },
      { id: "dot", name: "ドットフェードGIF生成", file: "tools/dot-fade-gif-generator.html" },
      { id: "pv", name: "歌詞PVメイカー", file: "tools/lyric-pv-maker.html" },
      { id: "midi", name: "MIDI歌詞マッチング", file: "tools/midi-lyrics-matcher.html" },
      { id: "vowel", name: "歌詞の連続音変換ツール", file: "tools/vowel-converter.html" }
    ];

    const menu = document.getElementById('menu');
    const frame = document.getElementById('tool-frame');

    // ツール切り替え関数
    const loadTool = (tool) => {
      frame.src = tool.file;
      history.pushState(null, "", `?tool=${tool.id}`);
    };

    tools.forEach(tool => {
      const btn = document.createElement('button');
      btn.className = "w-full text-left px-3 py-2 rounded-md transition-colors bg-gray-100/10 hover:bg-gray-100/20 text-sm";
      btn.textContent = tool.name;
      btn.onclick = () => loadTool(tool);
      menu.appendChild(btn);
    });

    // 初期ロード判定
    const params = new URLSearchParams(window.location.search);
    const toolId = params.get('tool');
    const defaultTool = tools.find(t => t.id === toolId) || tools[0];
    
    frame.src = defaultTool.file;
  </script>
