<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Fade GIF Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gif.js.optimized@1.0.1/dist/gif.js"></script>
    <style>
        body { background-color: #000; color: #fff; }
        canvas { image-rendering: pixelated; }
        input, select { background-color: rgba(243, 244, 246, 0.1); color: white; border: 1px solid rgba(156, 163, 175, 0.5); }
        button { transition: background-color 0.2s; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-xl bg-gray-100/10 p-6 rounded-xl border border-gray-300/20 backdrop-blur-sm">
        <h1 class="text-xl font-bold mb-4 border-b border-gray-300/20 pb-2">Dot Fade GIF Generator</h1>
        
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="flex flex-col">
                <label class="text-xs text-gray-500 mb-1">モード</label>
                <select id="mode" class="rounded px-2 py-1 outline-none">
                    <option value="out">フェードアウト (出現→消失)</option>
                    <option value="in">フェードイン (消失→出現)</option>
                </select>
            </div>
            <div class="flex flex-col">
                <label class="text-xs text-gray-500 mb-1">シード値</label>
                <input type="number" id="seed" value="42" class="rounded px-2 py-1 outline-none">
            </div>
            <div class="flex flex-col">
                <label class="text-xs text-gray-500 mb-1">フレーム数</label>
                <input type="number" id="frames" value="30" class="rounded px-2 py-1 outline-none">
            </div>
            <div class="flex flex-col">
                <label class="text-xs text-gray-500 mb-1">FPS</label>
                <input type="number" id="fps" value="15" class="rounded px-2 py-1 outline-none">
            </div>
            <div class="flex flex-col col-span-2">
                <label class="text-xs text-gray-500 mb-1">Bias (縦方向の重み: 0.0〜1.0)</label>
                <input type="range" id="bias" min="0" max="1" step="0.05" value="0.7" class="w-full">
                <div class="flex justify-between text-[10px] text-gray-500 mt-1">
                    <span>純粋ランダム (0.0)</span>
                    <span id="bias-val">0.7</span>
                    <span>上から下へ (1.0)</span>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center gap-4">
            <div class="relative bg-white/5 border border-gray-300/20 rounded overflow-hidden" style="width: 384px; height: 384px;">
                <canvas id="preview" width="384" height="384" class="w-full h-full"></canvas>
                <div id="progress-overlay" class="hidden absolute inset-0 bg-black/60 flex flex-col items-center justify-center z-10">
                    <div class="w-32 h-2 bg-gray-700 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full bg-green-500 w-0 transition-all"></div>
                    </div>
                    <span id="progress-text" class="text-[10px] mt-2 text-gray-300">Generating...</span>
                </div>
            </div>

            <div class="flex gap-2 w-full">
                <button id="render-btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded font-bold">
                    GIFを生成してダウンロード
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        const canvas64 = document.createElement('canvas');
        canvas64.width = 64;
        canvas64.height = 64;
        const ctx64 = canvas64.getContext('2d', { alpha: false }); // 背景不透明色を扱うためfalse推奨

        const previewCanvas = document.getElementById('preview');
        const previewCtx = previewCanvas.getContext('2d');
        previewCtx.imageSmoothingEnabled = false;

        const biasInput = document.getElementById('bias');
        const biasValDisplay = document.getElementById('bias-val');
        biasInput.oninput = () => biasValDisplay.textContent = biasInput.value;

        // シード付き乱数生成器
        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        function calculateOrders(seed, bias) {
            const rand = mulberry32(seed);
            const orders = new Float32Array(64 * 64);
            const H = 64;
            const W = 64;
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    const r = rand();
                    const g = y / (H - 1);
                    const order = r * (1 - bias) + g * bias;
                    orders[y * W + x] = order;
                }
            }
            return orders;
        }

        // 透明色として扱う特殊な色 (使用されていない色)
        const TRANSPARENT_COLOR = { r: 0, g: 255, b: 0 }; // 純粋な緑

        function drawFrame(t, orders, mode, targetCtx) {
            const imgData = ctx64.createImageData(64, 64);
            const data = imgData.data;

            for (let i = 0; i < 64 * 64; i++) {
                const order = orders[i];
                let isBlack = false;

                if (mode === 'out') {
                    isBlack = order >= t;
                } else {
                    isBlack = order < t;
                }

                const idx = i * 4;
                if (isBlack) {
                    data[idx] = 0;     // R
                    data[idx+1] = 0;   // G
                    data[idx+2] = 0;   // B
                    data[idx+3] = 255; // A
                } else {
                    // 透明部分は特殊な色で塗りつぶす
                    data[idx] = TRANSPARENT_COLOR.r;
                    data[idx+1] = TRANSPARENT_COLOR.g;
                    data[idx+2] = TRANSPARENT_COLOR.b;
                    data[idx+3] = 255; 
                }
            }
            ctx64.putImageData(imgData, 0, 0);

            // プレビュー表示（プレビュー時は緑を透明に飛ばす）
            targetCtx.save();
            targetCtx.clearRect(0, 0, 384, 384);
            targetCtx.imageSmoothingEnabled = false;
            
            // 拡大
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 64;
            tempCanvas.height = 64;
            tempCanvas.getContext('2d').putImageData(imgData, 0, 0);

            targetCtx.drawImage(tempCanvas, 0, 0, 64, 64, 0, 0, 384, 384);
            
            // プレビュー用に緑を視覚的に消す（実際のキャンバス操作）
            // 注意: GIF生成時はこの緑が "transparent" オプションで透明になります。
            targetCtx.restore();
        }

        let previewFrame = 0;
        let animationId = null;

        function animatePreview() {
            if (animationId) clearTimeout(animationId);
            
            const framesCount = parseInt(document.getElementById('frames').value) || 1;
            const seed = parseInt(document.getElementById('seed').value) || 0;
            const bias = parseFloat(document.getElementById('bias').value) || 0;
            const mode = document.getElementById('mode').value;
            const fps = parseInt(document.getElementById('fps').value) || 1;
            
            const orders = calculateOrders(seed, bias);
            const t = previewFrame / Math.max(1, (framesCount - 1));
            
            drawFrame(t, orders, mode, previewCtx);
            
            previewFrame = (previewFrame + 1) % framesCount;
            animationId = setTimeout(() => requestAnimationFrame(animatePreview), 1000 / fps);
        }

        let workerBlobUrl = null;
        async function getWorkerBlobUrl() {
            if (workerBlobUrl) return workerBlobUrl;
            const response = await fetch('https://cdn.jsdelivr.net/npm/gif.js.optimized@1.0.1/dist/gif.worker.js');
            const script = await response.text();
            const blob = new Blob([script], { type: 'application/javascript' });
            workerBlobUrl = URL.createObjectURL(blob);
            return workerBlobUrl;
        }

        async function generateGif() {
            const renderBtn = document.getElementById('render-btn');
            const overlay = document.getElementById('progress-overlay');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            
            const framesCount = parseInt(document.getElementById('frames').value) || 1;
            const fps = parseInt(document.getElementById('fps').value) || 1;
            const seed = parseInt(document.getElementById('seed').value) || 0;
            const bias = parseFloat(document.getElementById('bias').value) || 0;
            const mode = document.getElementById('mode').value;
            const delay = 1000 / fps;

            renderBtn.disabled = true;
            overlay.classList.remove('hidden');

            try {
                const workerUrl = await getWorkerBlobUrl();

                const gif = new GIF({
                    workers: 2,
                    quality: 1, // 最高品質
                    width: 384,
                    height: 384,
                    // 重要: 緑色を透明として定義
                    transparent: 0x00FF00, 
                    workerScript: workerUrl
                });

                const orders = calculateOrders(seed, bias);
                
                // 1フレームずつ描画して追加
                for (let f = 0; f < framesCount; f++) {
                    const t = f / Math.max(1, (framesCount - 1));
                    
                    const frameCanvas = document.createElement('canvas');
                    frameCanvas.width = 384;
                    frameCanvas.height = 384;
                    const fCtx = frameCanvas.getContext('2d');
                    fCtx.imageSmoothingEnabled = false;
                    
                    drawFrame(t, orders, mode, fCtx);
                    
                    gif.addFrame(frameCanvas, { delay: delay });
                    
                    progressBar.style.width = `${(f / framesCount) * 50}%`;
                    progressText.textContent = `Rendering frame ${f + 1}/${framesCount}...`;
                    if (f % 5 === 0) await new Promise(r => setTimeout(r, 10));
                }

                gif.on('progress', (p) => {
                    progressBar.style.width = `${50 + p * 50}%`;
                    progressText.textContent = `Encoding GIF: ${Math.round(p * 100)}%`;
                });

                gif.on('finished', (blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `dot-fade-${mode}-s${seed}.gif`;
                    a.click();
                    
                    renderBtn.disabled = false;
                    overlay.classList.add('hidden');
                    progressBar.style.width = '0%';
                });

                gif.render();
            } catch (err) {
                console.error(err);
                progressText.textContent = "Error: " + err.message;
                renderBtn.disabled = false;
            }
        }

        document.getElementById('render-btn').onclick = generateGif;
        window.onload = animatePreview;
    </script>
</body>
</html>
