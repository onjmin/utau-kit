const colorThemes = {
  "イワシがつちからはえてくるんだ風": { "maj7": "#d8b4fe", "m7": "#86efac", "7": "#fca5a5", "other": "#9ca3af", specialVI: "#f59e0b" },
  "ブドウがかげからのぞいてるんだ風": { "maj7": "#c084fc", "m7": "#fb7185", "7": "#fde047", "dim": "#a5b4fc", "other": "#d1d5db", specialVI: "#f97316" },
  "ことりがそらへとおちてゆく風": { "degree1": "#7dd3fc", "degree2": "#a78bfa", "degree3": "#f472b6", "degree4": "#fbbf24", "degree5": "#34d399", "degree6": "#fb7185", "degree7": "#e879f9", "proxy": "#facc15", "other": "#9ca3af" },

};

const themeKeys = {
  "イワシがつちからはえてくるんだ風": 5,
  "ブドウがかげからのぞいてるんだ風": 0,
  "ことりがそらへとおちてゆく風": 0,
  "あさやけもゆうやけもないんだ風": 3
};

const rootToPitch = {
  C: 0, "C#": 1, Db: 1, D: 2, "D#": 3, Eb: 3, E: 4, F: 5, "F#": 6, Gb: 6, G: 7, "G#": 8, Ab: 8, A: 9, "A#": 10, Bb: 10, B: 11
};

const themeConfig = {
  maxLightness: 0.35,
  saturation: 0.65
};

const setThemeConfig = (config) => Object.assign(themeConfig, config);

const normalizeHue = (h) => ((h % 360) + 360) % 360;

const createColor = (h, s, l) => {
  const safeL = Math.min(l, themeConfig.maxLightness);
  return `hsl(${normalizeHue(h)}, ${s * 100}%, ${safeL * 100}%)`;
};

const keyToPitch = (key) => typeof key === 'number' ? key : rootToPitch[key] ?? 0;

const getDegree = (chordObj, key) => {
  const root = chordObj.pitch % 12;
  const keyPitch = keyToPitch(key);
  const diff = (root - keyPitch + 12) % 12;
  const scaleMap = [1, null, 2, null, 3, 4, null, 5, null, 6, null, 7];
  return scaleMap[diff];
};

const isDegree = (chordObj, key, degree) => getDegree(chordObj, key) === degree;

const getProxyColor = (baseColor) => {
  const proxyMap = {
    '#7dd3fc': '#38bdf8',
    '#a78bfa': '#818cf8',
    '#f472b6': '#fb7185',
    '#fbbf24': '#f59e0b',
    '#34d399': '#22c55e',
    '#fb7185': '#f43f5e',
    '#e879f9': '#c084fc'
  };
  return proxyMap[baseColor] || '#fcd34d';
};

const qualityToHue = (quality) => {
  if (quality.includes('maj7')) return 120;
  if (quality.includes('maj')) return 110;
  if (quality.includes('m7')) return 200;
  if (quality.includes('7')) return 330;
  if (quality.includes('dim')) return 280;
  return 50;
};

const degreeHueMap = {
  1: 0,
  2: 40,
  3: 80,
  4: 120,
  5: 160,
  6: 200,
  7: 240
};

const getIwashiColor = (chordObj, key) => {
  const degree = getDegree(chordObj, key);
  const q = chordObj.chord;

  // 1. ベース色相をクオリティで決定
  let h = qualityToHue(q);

  // 2. ディグリー補正：VI度m7は色相を+30シフト（分析の「特別区別」を再現）
  if (degree === 6 && q.includes('m7')) {
    h = (h + 30) % 360;
  }

  // 3. ルート音による微調整（色ムラを論理的に再現）
  const pitch = chordObj.pitch ?? keyToPitch(chordObj.key ?? 'C');
  h = (h + (pitch % 12) * 2) % 360;

  return createColor(h, themeConfig.saturation, 0.3);
};

const getBudouColor = (chordObj, key) => {
  const q = chordObj.chord;
  if (isDegree(chordObj, key, 6) && q === 'm7') {
    return createColor(220, themeConfig.saturation, 0.3);
  }
  if (q.includes('maj')) return createColor(140, themeConfig.saturation, 0.32);
  if (q.includes('dim')) return createColor(280, themeConfig.saturation, 0.28);
  if (q.includes('m7')) return createColor(210, themeConfig.saturation, 0.3);
  if (q.includes('7')) return createColor(10, themeConfig.saturation, 0.3);
  return createColor(50, themeConfig.saturation, 0.3);
};

const getKotoriColor = (chordObj, key, lastColor) => {
  const degree = getDegree(chordObj, key);
  const baseHue = degreeHueMap[degree] ?? 0;
  const baseColor = createColor(baseHue, themeConfig.saturation, 0.3);
  if (baseColor === lastColor) {
    return createColor(baseHue, themeConfig.saturation, 0.25);
  }
  return baseColor;
};

const getAsayakeColor = (chordObj, key) => {
  const degree = getDegree(chordObj, key);
  if (degree === 3) return createColor(200, themeConfig.saturation, 0.3);
  const q = chordObj.chord;
  if (q.includes('maj7')) return createColor(100, themeConfig.saturation, 0.32);
  if (q.includes('m7')) return createColor(210, themeConfig.saturation, 0.28);
  return createColor(40, themeConfig.saturation, 0.3);
};

const getChordColor = (chordObj, themeName, lastColor) => {
  const key = themeKeys[themeName] ?? 0;
  switch (themeName) {
    case "イワシがつちからはえてくるんだ風":
      return getIwashiColor(chordObj, key);
    case "ブドウがかげからのぞいてるんだ風":
      return getBudouColor(chordObj, key);
    case "ことりがそらへとおちてゆく風":
      return getKotoriColor(chordObj, key, lastColor);
    case "あさやけもゆうやけもないんだ風":
      return getAsayakeColor(chordObj, key);
    default:
      return getIwashiColor(chordObj, key);
  }
};

const notationMaps = {
  maj: { label: "メジャー系", options: { M7: "M7", "△7": "△7", "Δ7": "Δ7" } },
  min: { label: "マイナー系", options: { m7: "m7", "-7": "-7" } },
  dim: { label: "ディミニッシュ系", options: { dim: "dim", "〇": "〇" } },
  half: { label: "ハーフディミニッシュ", options: { "m7-5": "m7(♭5)", "φ": "φ", "ø": "ø" } },
  aug: { label: "オーギュメント", options: { aug: "aug", "+": "+" } },
  accidental: { label: "記号表示", options: { standard: "♯/♭", ascii: "#/b" } }

const hslToRgb = (h, s, l) => {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = (n) => {
    const k = (n + h / 30) % 12;
    return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
};

const ChordDisplay = ({ currentTime, progression, bpm, theme, formatChord }) => {
  const [chords, setChords] = useState([]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const { parseChords } = await import('https://rpgen3.github.io/piano/mjs/parseChords.mjs');
        if (!cancelled) setChords(parseChords(progression, bpm));
      } catch {
        if (!cancelled) setChords([]);
      }
    })();
    return () => { cancelled = true; };
  }, [progression, bpm]);

  const getActiveChord = () => {
    if (!chords || chords.length === 0) return null;
    for (let i = 0; i < chords.length; i++) {
      const c = chords[i];
      if (currentTime >= c.when && currentTime < c.when + c.duration) return c;
    }
    return null;
  };

  const activeChord = getActiveChord();
  const totalDuration = chords.length > 0
    ? chords[chords.length - 1].when + chords[chords.length - 1].duration
    : 0;

  const formatTime = (t) => {
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    const ds = Math.floor((t % 1) * 10);
    return `${m}:${s.toString().padStart(2, '0')}.${ds}`;
  };

  const textToExoHex = (str) => {
    let hex = '';
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      hex += (code & 0xFF).toString(16).padStart(2, '0');
      hex += ((code >> 8) & 0xFF).toString(16).padStart(2, '0');
    }
    return hex.padEnd(4096, '0');
  };

  const [fps, setFps] = useState(30);
  const downloadExo = () => {
    if (!chords || chords.length === 0) return;
    const totalFrames = Math.ceil(totalDuration * fps);
    const lines = ['[exedit]'];
    lines.push('width=1920');
    lines.push('height=1080');
    lines.push(`rate=${fps}`);
    lines.push('scale=1');
    lines.push(`length=${totalFrames}`);
    lines.push(`edit_Num=${chords.length}`);
    lines.push('audio=');
    let lastColor = null;
    chords.forEach((c, i) => {
      const start = Math.round(c.when * fps);
      const end = Math.max(start, Math.round((c.when + c.duration) * fps) - 1);
      const text = c.key + formatChord(c.chord);
      const chordColor = getChordColor(c, theme, lastColor);
      lastColor = chordColor;
      const match = chordColor.match(/hsl\(([\d.]+),\s*([\d.]+)%,\s*([\d.]+)%\)/);
      const [r, g, b] = match ? hslToRgb(Number(match[1]), Number(match[2]), Number(match[3])) : [255, 255, 255];
      lines.push(`[${i}]`);
      lines.push(`start=${start + 1}`);
      lines.push(`end=${end + 1}`);
      lines.push('layer=1');
      lines.push('overlay=1');
      lines.push('_version=1');
      lines.push('_editor=1');
      lines.push(`[${i}.0]`);
      lines.push('_name=テキスト');
      lines.push('size=64');
      lines.push('font=MS ゴシック');
      lines.push('align=1');
      lines.push('type=0');
      const toHex = (v) => Math.round(v).toString(16).padStart(2, '0').toUpperCase();
      lines.push(`color=${toHex(r)}${toHex(g)}${toHex(b)}`);
      lines.push(`text=${textToExoHex(text)}`);
      lines.push(`[${i}.1]`);
      lines.push('_name=標準描画');
      lines.push('X=0.0');
      lines.push('Y=0.0');
      lines.push('Z=0.0');
      lines.push('拡大率=100.00');
      lines.push('透明度=0.0');
      lines.push('回転=0.00');
      lines.push('blend=0');
    });
    const content = lines.join('\r\n');
    const strArray = Encoding.stringToCode(content);
    const sjisArray = Encoding.convert(strArray, 'SJIS', 'UNICODE');
    const blob = new Blob([new Uint8Array(sjisArray)], { type: 'text/plain;charset=shift_jis' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'chord_progression.exo';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const chordName = activeChord ? activeChord.key + formatChord(activeChord.chord) : null;

  return (
    <div className="p-4 border border-gray-300 rounded bg-gray-100/5">
      <div className="flex flex-wrap items-center gap-4">
        <div className="flex-1 min-w-0">
          <div className="text-xs font-bold text-gray-500 mb-1">現在のコード</div>
          <div className="misaki-font text-5xl font-bold text-white truncate">
            {chordName || '---'}
          </div>
        </div>
        <div className="text-right text-xs text-gray-400 whitespace-nowrap">
          <div>{formatTime(currentTime)}</div>
          <div>/ {formatTime(totalDuration)}</div>
        </div>
        <div className="flex items-center gap-2">
          <label className="text-xs text-gray-400 whitespace-nowrap">FPS</label>
          <input type="number" min="1" max="120" value={fps} onChange={(e) => setFps(Number(e.target.value))} className="w-16 p-1 border border-gray-300 bg-gray-100/10 rounded text-white text-sm" />
        </div>
        <button
          onClick={downloadExo}
          disabled={!chords || chords.length === 0}
          className="px-4 py-2 bg-blue-600 hover:bg-blue-500 disabled:bg-gray-600 disabled:opacity-50 text-white rounded text-sm whitespace-nowrap"
        >
          .exo エクスポート
        </button>
      </div>
    </div>
  );
};

const App = () => {
  const [progression, setProgression] = useState(initialProgression);
  const [bpm, setBpm] = useState(135);
  const [theme, setTheme] = useState("イワシがつちからはえてくるんだ風");
  const [maxLightness, setMaxLightness] = useState(themeConfig.maxLightness);
  const [textOffsetX, setTextOffsetX] = useState(8);
  const [textOffsetY, setTextOffsetY] = useState(-4);
  const [textSize, setTextSize] = useState(38);
  const [triangleScale, setTriangleScale] = useState(0.78);
  const [playbackMode, setPlaybackMode] = useState("url");
  const [youtubeUrl, setYoutubeUrl] = useState("https://www.youtube.com/watch?v=d_T1StgldnM");
  const [selectedFile, setSelectedFile] = useState(null);
  const [fileUrl, setFileUrl] = useState("");
  const [fileType, setFileType] = useState("audio");
  const [syncedDelay, setSyncedDelay] = useState(7.2);
  const [syncedSeek, setSyncedSeek] = useState(0);
  const [youtubeApiReady, setYoutubeApiReady] = useState(false);
  const [youtubePlayerReady, setYoutubePlayerReady] = useState(false);
  const [notation, setNotation] = useState({ maj: "Δ7", min: "m7", dim: "dim", half: "m7(♭5)", aug: "aug", accidental: "ascii" });
  const [isPlaying, setIsPlaying] = useState(false);
  const [currentTime, setCurrentTime] = useState(0);
  const [chords, setChords] = useState([]);
  const [isReady, setIsReady] = useState(false);
  const [isScrubbing, setIsScrubbing] = useState(false);
  const [previewBg, setPreviewBg] = useState('b');
  const startTimeRef = useRef(0);
  const progressBarRef = useRef(null);
  const youtubePlayerRef = useRef(null);
  const youtubeContainerRef = useRef(null);
  const mediaRef = useRef(null);

  const parseYouTubeId = (url) => {
    try {
      const parsed = new URL(url);
      if (parsed.hostname.includes('youtu.be')) {
        return parsed.pathname.slice(1);
      }
      if (parsed.hostname.includes('youtube.com')) {
        return parsed.searchParams.get('v');
      }
      return null;
    } catch {
      return null;
    }
  };

  useEffect(() => {
    if (window.YT) {
      setYoutubeApiReady(true);
      return;
    }
    if (document.querySelector('script[src="https://www.youtube.com/iframe_api"]')) {
      return;
    }
    window.onYouTubeIframeAPIReady = () => setYoutubeApiReady(true);
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.body.appendChild(tag);
    return () => {
      delete window.onYouTubeIframeAPIReady;
    };
  }, []);

  useEffect(() => {
    if (!youtubeApiReady || playbackMode !== 'url' || !youtubeContainerRef.current) return;
    const videoId = parseYouTubeId(youtubeUrl);
    if (!videoId) return;
    if (youtubePlayerRef.current) {
      if (window.YT) {
        youtubePlayerRef.current.loadVideoById({ videoId, startSeconds: 0 });
      }
      return;
    }
    youtubePlayerRef.current = new window.YT.Player(youtubeContainerRef.current, {
      width: '320',
      height: '180',
      videoId,
      playerVars: { rel: 0, modestbranding: 1, controls: 1, disablekb: 1 },
      events: {
        onReady: () => setYoutubePlayerReady(true),
        onStateChange: () => {},
      },
    });

    return () => {
      if (youtubePlayerRef.current) {
        try {
          youtubePlayerRef.current.destroy();
        } catch (e) {
          console.warn('Player destroy error:', e);
        }
        youtubePlayerRef.current = null;
      }
      if (youtubeContainerRef.current) {
        youtubeContainerRef.current.innerHTML = '';
      }
    };
  }, [youtubeApiReady, playbackMode, youtubeUrl]);

  useEffect(() => {
    if (playbackMode === 'file' && selectedFile) {
      const url = URL.createObjectURL(selectedFile);
      setFileUrl(url);
      setFileType(selectedFile.type.startsWith('video/') ? 'video' : 'audio');
      return () => URL.revokeObjectURL(url);
    }
    if (playbackMode === 'url' && youtubeUrl && !parseYouTubeId(youtubeUrl)) {
      setFileUrl(youtubeUrl);
      const ext = youtubeUrl.split('.').pop().toLowerCase();
      setFileType(['mp4', 'webm', 'mov', 'avi', 'mkv'].includes(ext) ? 'video' : 'audio');
      return;
    }
    setFileUrl('');
  }, [playbackMode, selectedFile, youtubeUrl]);

  const seekAndPlayMedia = async () => {
    if (playbackMode === 'url' && parseYouTubeId(youtubeUrl)) {
      if (!youtubePlayerReady || !youtubePlayerRef.current) return false;
      try {
        youtubePlayerRef.current.seekTo(syncedSeek, true);
        youtubePlayerRef.current.playVideo();
        return true;
      } catch (e) {
        console.error('YouTube play error', e);
        return false;
      }
    }
    const media = mediaRef.current;
    if (!media) return false;
    try {
      media.currentTime = syncedSeek;
      await media.play();
      return true;
    } catch (e) {
      console.error('Media play error', e);
      return false;
    }
  };

  const handleSyncPlay = async () => {
    const ready = await prepareAnimation();
    if (!ready) return;
    setIsPlaying(false);
    setCurrentTime(0);
    const started = await seekAndPlayMedia();
    if (!started) return;
    setTimeout(() => {
      startTimeRef.current = performance.now();
      setIsPlaying(true);
    }, Math.round(syncedDelay * 1000));
  };

  const prepareAnimation = useCallback(async () => {
    try {
      const { parseChords } = await import('https://rpgen3.github.io/piano/mjs/parseChords.mjs');
      setChords(parseChords(progression, bpm));
      setIsReady(true);
      setIsPlaying(false);
      setCurrentTime(0);
      startTimeRef.current = performance.now();
      return true;
    } catch (e) {
      console.error("Parse Error", e);
      setIsReady(false);
      return false;
    }
  }, [progression, bpm]);

  const formatChord = (chord) => {
    let f = chord;
    if (f.includes('m7(♭5)')) f = f.replace('m7(♭5)', notation.half);
    f = f.replace(/M7/g, notation.maj);
    f = f.replace(/m7/g, notation.min);
    f = f.replace(/dim/g, notation.dim);
    f = f.replace(/aug/g, notation.aug);
    if (notation.accidental === 'ascii') {
      f = f.replace(/♯/g, '#').replace(/♭/g, 'b');
    }
    return f;
  };

  const renderFormattedChord = (chord) => {
    const formatted = formatChord(chord);
    return formatted.split(/([△Δ])/g).map((part, index) =>
      part === '△' || part === 'Δ'
        ? <span key={index} style={{ display: 'inline-block', fontSize: 'inherit', lineHeight: 1, verticalAlign: 'baseline', transform: `scaleX(${triangleScale})`, transformOrigin: 'left center' }}>{part}</span>
        : part
    );
  };

  const totalDuration = chords.length > 0 ? chords[chords.length - 1].when + chords[chords.length - 1].duration : 1;

  const updateCurrentTimeFromClientX = (clientX) => {
    const rect = progressBarRef.current?.getBoundingClientRect();
    if (!rect) return;
    const x = clientX - rect.left;
    const newTime = Math.max(0, Math.min(totalDuration, (x / rect.width) * totalDuration));
    setCurrentTime(newTime);
    startTimeRef.current = performance.now() - (newTime * 1000);
  };

  useEffect(() => {
    setThemeConfig({ maxLightness });
  }, [maxLightness]);

  useEffect(() => {
    let frame;
    const animate = () => {
      if (isPlaying) {
        const nextTime = (performance.now() - startTimeRef.current) / 1000;
        if (nextTime >= totalDuration) {
          setCurrentTime(totalDuration);
          setIsPlaying(false);
        } else {
          setCurrentTime(nextTime);
        }
      }
      frame = requestAnimationFrame(animate);
    };
    frame = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(frame);
  }, [isPlaying, totalDuration]);

  useEffect(() => {
    const handleMouseMove = (e) => {
      if (!isScrubbing) return;
      updateCurrentTimeFromClientX(e.clientX);
    };
    const handleMouseUp = () => {
      if (isScrubbing) setIsScrubbing(false);
    };
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseup', handleMouseUp);
    return () => {
      window.removeEventListener('mousemove', handleMouseMove);
      window.removeEventListener('mouseup', handleMouseUp);
    };
  }, [isScrubbing, totalDuration]);

  const togglePlay = () => {
    if (!isReady) return;
    if (!isPlaying) startTimeRef.current = performance.now() - (currentTime * 1000);
    setIsPlaying(!isPlaying);
  };

  const totalProgress = (currentTime / totalDuration) * 100;
  const viewDuration = (60 / bpm) * 8;
  const startTime = Math.floor(currentTime / viewDuration) * viewDuration;
  const endTime = startTime + viewDuration;

  return (
    <div className="p-6 min-h-screen">
      <h1 className="text-xl font-bold mb-4">コード進行アニメーション</h1>
      <div className="mb-4 text-xs text-gray-400">コード進行をコピペするなら <a href="https://rechord.cc/" target="_blank" rel="noopener noreferrer" className="underline text-blue-400 hover:text-blue-300">https://rechord.cc/</a> (Rechord.cc) がオススメ</div>
      <div className="flex flex-col gap-4 mb-8">
        <textarea className="w-full p-2 h-32 border border-gray-300 rounded bg-gray-100/10" value={progression} onChange={(e) => setProgression(e.target.value)} />
        <div className="flex flex-col gap-4 p-4 border border-gray-300 rounded bg-gray-100/5">
          <div className="flex flex-wrap items-center gap-4">
            <div>
              <label className="block text-xs font-bold mb-1 text-gray-500">BPM</label>
              <input type="number" value={bpm} onChange={(e) => setBpm(Number(e.target.value))} className="w-20 p-1 border border-gray-300 bg-gray-100/10 rounded" />
            </div>
            <div>
              <label className="block text-xs font-bold mb-1 text-gray-500">配色テーマ</label>
              <select value={theme} onChange={(e) => setTheme(e.target.value)} className="p-1 border border-gray-300 bg-white text-black rounded">
                {Object.keys(colorThemes).map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-bold mb-1 text-gray-500">明度上限</label>
              <input type="range" min="0.1" max="0.6" step="0.01" value={maxLightness} onChange={(e) => setMaxLightness(Number(e.target.value))} className="w-40" />
              <div className="text-xs text-gray-400">{Math.round(maxLightness * 100)}%</div>
            </div>
            <div>
              <label className="block text-xs font-bold mb-1 text-gray-500">文字位置 X</label>
              <input type="range" min="0" max="16" step="1" value={textOffsetX} onChange={(e) => setTextOffsetX(Number(e.target.value))} className="w-40" />
              <div className="text-xs text-gray-400">{textOffsetX}px</div>
            </div>
            <div>
              <label className="block text-xs font-bold mb-1 text-gray-500">文字位置 Y</label>
              <input type="range" min="-8" max="0" step="1" value={textOffsetY} onChange={(e) => setTextOffsetY(Number(e.target.value))} className="w-40" />
              <div className="text-xs text-gray-400">{textOffsetY}px</div>
            </div>
            <div>
              <label className="block text-xs font-bold mb-1 text-gray-500">文字サイズ</label>
              <input type="range" min="16" max="48" step="1" value={textSize} onChange={(e) => setTextSize(Number(e.target.value))} className="w-40" />
              <div className="text-xs text-gray-400">{textSize}px</div>
            </div>
            <div>
              <label className="block text-xs font-bold mb-1 text-gray-500">△/Δ 比率</label>
              <input type="range" min="0.6" max="1.0" step="0.01" value={triangleScale} onChange={(e) => setTriangleScale(Number(e.target.value))} className="w-40" />
              <div className="text-xs text-gray-400">{Math.round(triangleScale * 100)}%</div>
            </div>
          </div>
          <div className="flex flex-wrap gap-4">
            {Object.entries(notationMaps).map(([type, { label, options }]) => (
              <div key={type} className="min-w-[100px] flex-1">
                <label className="block text-xs font-bold mb-1 text-gray-500">{label}</label>
                <select value={notation[type]} onChange={(e) => setNotation({...notation, [type]: e.target.value})} className="w-full p-1 border border-gray-300 bg-white text-black rounded">
                  {Object.entries(options).map(([key, val]) => (
                    <option key={key} value={type === 'accidental' ? key : val}>{val}</option>
                  ))}
                </select>
              </div>
            ))}
          </div>
        </div>
        <div className="p-4 border border-gray-300 rounded bg-gray-100/5">
          <div className="mb-3 font-bold text-gray-200">同期再生設定</div>
          <div className="flex flex-wrap gap-4 items-end">
            <label className="flex items-center gap-2 text-sm text-gray-200">
              <input type="radio" name="playbackMode" value="url" checked={playbackMode === 'url'} onChange={() => setPlaybackMode('url')} />
              URLから再生
            </label>
            <label className="flex items-center gap-2 text-sm text-gray-200">
              <input type="radio" name="playbackMode" value="file" checked={playbackMode === 'file'} onChange={() => setPlaybackMode('file')} />
              動画/音楽ファイル
            </label>
            <div className="flex-1 min-w-[280px]">
              <label className="block text-xs font-bold mb-1 text-gray-500">コンテンツ</label>
              {playbackMode === 'url' ? (
                <input type="text" className="w-full p-2 border border-gray-300 rounded bg-gray-100/10 text-white" value={youtubeUrl} onChange={(e) => setYoutubeUrl(e.target.value)} />
              ) : (
                <input type="file" accept="audio/*,video/*" onChange={(e) => setSelectedFile(e.target.files?.[0] || null)} className="w-full rounded bg-gray-100/10 text-sm text-gray-200" />
              )}
            </div>
          </div>
          <div className="mt-4 flex flex-wrap gap-2 items-center">
            <button onClick={handleSyncPlay} className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded">同期再生</button>
            <div className="flex items-center gap-1">
              <label className="text-xs text-gray-400 whitespace-nowrap">シーク</label>
              <input type="number" min="0" step="1" value={syncedSeek} onChange={(e) => setSyncedSeek(Number(e.target.value))} className="w-16 p-1 border border-gray-300 bg-gray-100/10 rounded text-white text-sm" />
              <span className="text-xs text-gray-400">秒</span>
            </div>
            <div className="flex items-center gap-1">
              <label className="text-xs text-gray-400 whitespace-nowrap">遅延開始</label>
              <input type="number" min="0" step="0.1" value={syncedDelay} onChange={(e) => setSyncedDelay(Number(e.target.value))} className="w-16 p-1 border border-gray-300 bg-gray-100/10 rounded text-white text-sm" />
              <span className="text-xs text-gray-400">秒</span>
            </div>
            <span className="text-sm text-gray-400">コンテンツを{syncedSeek}秒から再生し、{syncedDelay.toFixed(2)}秒後にコード進行アニメーションを開始します。</span>
          </div>
          <div className="mt-4">
            <div className="w-full max-w-xl" style={{ display: playbackMode === 'url' && parseYouTubeId(youtubeUrl) ? '' : 'none' }}>
              <div className="bg-black aspect-video" ref={youtubeContainerRef} />
              <p className="text-xs text-yellow-400 mt-1">埋め込み内の動画の再生を開始してから「同期再生」ボタンを押してください</p>
            </div>
            {!(playbackMode === 'url' && parseYouTubeId(youtubeUrl)) && (
              fileUrl ? (
                fileType === 'video' ? (
                  <video ref={mediaRef} src={fileUrl} controls className="w-full max-w-xl bg-black" />
                ) : (
                  <audio ref={mediaRef} src={fileUrl} controls className="w-full" />
                )
              ) : (
                <div className="text-sm text-gray-400">URLまたはファイルを指定するとプレビューが表示されます。</div>
              )
            )}
          </div>
        </div>
        <div className="mb-4">
          <div className="text-sm text-gray-500 mb-1">全体の再生位置を調節するバー</div>
          <div ref={progressBarRef} className={`group relative w-full h-2 bg-gray-300 rounded ${isScrubbing ? 'cursor-grabbing' : 'cursor-pointer'} mt-2`} onMouseDown={(e) => {
            if (!isReady) return;
            e.preventDefault();
            setIsScrubbing(true);
            updateCurrentTimeFromClientX(e.clientX);
          }}>
            <div className="absolute top-0 left-0 h-full bg-red-600 rounded" style={{ width: `${Math.min(100, Math.max(0, totalProgress))}%` }} />
            <div className="absolute top-[-4px] w-4 h-4 bg-red-600 rounded-full opacity-0 group-hover:opacity-100 transition-opacity" style={{ left: `${Math.min(100, Math.max(0, totalProgress))}%`, marginLeft: '-8px' }} />
          </div>
        </div>
        <div className="flex gap-2">
          <button onClick={prepareAnimation} className="px-4 py-1 bg-gray-100/10 hover:bg-gray-100/20 border border-gray-300 rounded">アニメーション準備</button>
          <button onClick={togglePlay} disabled={!isReady} className="px-4 py-1 bg-gray-100/10 hover:bg-gray-100/20 border border-gray-300 rounded disabled:opacity-50">{isPlaying ? "停止" : "再生"}</button>
        </div>
      </div>
      <ChordDisplay
        currentTime={currentTime}
        progression={progression}
        bpm={bpm}
        theme={theme}
        formatChord={formatChord}
      />
      <div className="w-full p-4 border-t border-gray-300 rounded bg-gray-100/5">
        <div className="mb-2 flex items-center justify-between">
          <div className="text-sm font-bold text-gray-200">生成結果プレビュー</div>
          <div className="flex rounded overflow-hidden border border-gray-600">
            <button onClick={() => setPreviewBg('r')} className={`px-3 py-1 text-xs ${previewBg === 'r' ? 'bg-red-600 text-white' : 'bg-gray-100/10 text-gray-400 hover:bg-gray-100/20'}`}>R</button>
            <button onClick={() => setPreviewBg('g')} className={`px-3 py-1 text-xs ${previewBg === 'g' ? 'bg-green-600 text-white' : 'bg-gray-100/10 text-gray-400 hover:bg-gray-100/20'}`}>G</button>
            <button onClick={() => setPreviewBg('b')} className={`px-3 py-1 text-xs ${previewBg === 'b' ? 'bg-blue-600 text-white' : 'bg-gray-100/10 text-gray-400 hover:bg-gray-100/20'}`}>B</button>
          </div>
        </div>
        <div className="relative h-16 w-full flex overflow-hidden rounded" style={{ backgroundColor: previewBg === 'r' ? '#FF0000' : previewBg === 'g' ? '#00FF00' : '#0000FF' }}>
          {(() => {
            const visibleChords = chords.filter(c => c.when < endTime && (c.when + c.duration) > startTime);
            let lastColor = null;
            return visibleChords.map((c, i) => {
              const left = Math.min(100, Math.max(0, (c.when - startTime) / viewDuration * 100));
              const width = Math.max(0, Math.min(100 - left, (c.duration / viewDuration) * 100));
              const color = getChordColor(c, theme, lastColor);
              lastColor = color;
              return (
                <div key={i} className="absolute top-0 bottom-0 p-2 font-bold text-white" style={{ left: `${left}%`, width: `${width}%`, backgroundColor: color }}>
                  <span className="misaki-font text-white" style={{ position: 'absolute', left: `${textOffsetX}px`, bottom: `${textOffsetY}px`, fontSize: `${textSize}px`, lineHeight: 1 }}>
                    {c.key}{renderFormattedChord(c.chord)}
                  </span>
                </div>
              );
            });
          })()}
          {isReady && <div className="absolute top-0 bottom-0 w-1 bg-white z-10" style={{ left: `${((currentTime - startTime) / viewDuration) * 100}%` }} />}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
