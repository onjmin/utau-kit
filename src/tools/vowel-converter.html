<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌詞の連続音変換ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-xl font-bold mb-4">歌詞の連続音変換ツール</h1>
        
        <div class="flex flex-col gap-4">
            <!-- 入力エリア -->
            <div class="flex flex-col gap-2">
                <label class="font-medium">変換元データ (一括入力形式)</label>
                <textarea id="input" rows="6" 
                    class="w-full p-3 rounded-md border border-gray-300 bg-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder='"- よ_E4" "- な_E4" "- か_F3" ...'></textarea>
            </div>

            <!-- 操作ボタン -->
            <button id="convertBtn" 
                class="bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md transition-colors font-medium">
                変換してコピー
            </button>

            <!-- 出力エリア -->
            <div class="flex flex-col gap-2">
                <label class="font-medium">変換結果</label>
                <textarea id="output" rows="6" readonly
                    class="w-full p-3 rounded-md border border-gray-300 bg-gray-100/50"></textarea>
            </div>
        </div>
    </div>

    <script>
        /**
         * ひらがなから母音を取得する関数
         * @param {string} kana 
         * @returns {string|null}
         */
        function kanaToVowel(kana) {
            if (/[ゃャ]/.test(kana)) return "a";
            if (/[ゅュ]/.test(kana)) return "u";
            if (/[ょョ]/.test(kana)) return "o";
            if (/[あかさたなはまやらわがざだばぱ]/.test(kana)) return "a";
            if (/[いきしちにひみりぎじぢびぴ]/.test(kana)) return "i";
            if (/[うくすつぬふむゆるぐずづぶぷ]/.test(kana)) return "u";
            if (/[えけせてねへめれげぜでべぺ]/.test(kana)) return "e";
            if (/[おこそとのほもよろごぞどぼぽ]/.test(kana)) return "o";
            return null;
        }

        document.getElementById('convertBtn').addEventListener('click', () => {
            const inputEl = document.getElementById('input');
            const outputEl = document.getElementById('output');
            const inputVal = inputEl.value;

            if (!inputVal.trim()) {
                alert("データを貼り付けてください");
                return;
            }

            try {
                // 文字列からデータを抽出
                const data = inputVal.match(/"[^"]+"/g).map(s => s.slice(1, -1));
                const result = [...data];

                // 変換ロジック
                for (let i = 0; i < data.length - 1; i++) {
                    const cur = data[i];
                    const next = data[i + 1];

                    const curMatch = cur.match(/^[-aiueo?]\s(.+?)_/);
                    if (!curMatch) continue;

                    const vowel = kanaToVowel(curMatch[1]);
                    if (!vowel) continue;

                    if (!next.startsWith("- ")) continue;

                    result[i + 1] = vowel + next.slice(1);
                }

                // 出力文字列生成
                const outputStr = result.map(s => `"${s}"`).join(" ");
                outputEl.value = outputStr;

                // クリップボードへコピー
                navigator.clipboard.writeText(outputStr).then(() => {
                    alert("変換結果をクリップボードにコピーしました！");
                });
            } catch (e) {
                alert("データの解析に失敗しました。形式を確認してください。");
            }
        });
    </script>
</body>
</html>
