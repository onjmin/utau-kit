<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lyric PV Maker - Pro Motion Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Hachi+Maru+Pop&family=Kaisei+Decol&family=Noto+Sans+JP&family=Potta+One&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background-color: #0b0f19; color: white; }
    canvas { display: block; }
    #font-select { background-color: white !important; color: black !important; }
    #font-select option { background-color: white; color: black; }
    @font-face {
      font-family: '美咲ゴシック';
      src: url('https://cdn.leafscape.be/misaki/misaki_gothic_web.woff2') format("woff2");
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="app" class="p-4 max-w-[1600px] mx-auto space-y-4">
    <header class="flex flex-col md:flex-row md:items-center justify-between border-b border-gray-800 pb-4 gap-4">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <i data-lucide="video" class="text-blue-500"></i> Lyric PV Maker 
        <span class="text-xs bg-blue-600/30 text-blue-400 px-2 py-0.5 rounded border border-blue-500/30">Pro Motion Engine</span>
      </h1>
      <div class="flex gap-2">
        <button onclick="setBgMode('blue')" class="bg-gray-100/10 hover:bg-gray-100/20 px-3 py-1 rounded text-xs">BB(青)</button>
        <button onclick="setBgMode('green')" class="bg-gray-100/10 hover:bg-gray-100/20 px-3 py-1 rounded text-xs">GB(緑)</button>
        <button onclick="setBgMode('black')" class="bg-gray-100/10 hover:bg-gray-100/20 px-3 py-1 rounded text-xs">黒</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      <div class="lg:col-span-1 space-y-4">
        <textarea id="lyric-input" class="w-full h-[200px] bg-gray-100/10 border border-gray-800 rounded p-4 text-sm" placeholder="[0:00.00]歌詞を入力">
# 【サビ】（前半 0～10秒）
K[00:00.60]究極の
G[00:00.80]音源を
N[00:01.40]作りたい

X[00:02.40]世間に
T[00:02.80]束音を
Y[00:04.20]広めたい

O[00:05.20]こっちにも
M[00:06.20]本業が
N[00:06.80]あるんだよ

M[00:08.00]手伝って
J[00:08.80]くれよ
W[00:09.40]無産が
F[00:10.00]さぁ！

# 【サビ】（後半 10～20秒）
Y[00:10.60]で　も
I[00:11.00]なんだかんだ
O[00:12.00]難しい

F[00:13.20]原音の
C[00:13.60]設定は
P[00:14.80]難しいんだ

W[00:16.00]ねえ　お前らも何かして頂戴！
N[00:18.80]えっ？　無理ですか　そーですか</textarea>
        
        <div class="space-y-3 p-4 bg-gray-100/10 rounded border border-gray-800 text-sm">
          <div class="grid grid-cols-2 gap-2">
            <div><label class="text-xs text-gray-500">表示行数</label><input type="number" id="display-rows" value="2" class="w-full bg-gray-100/10 p-1 rounded"></div>
            <div><label class="text-xs text-gray-500">イージング</label><input type="number" id="ease-strength" value="0.5" step="0.1" class="w-full bg-gray-100/10 p-1 rounded"></div>
          </div>
          
          <div class="grid grid-cols-2 gap-2">
            <div><label class="text-xs text-gray-500">文字色</label><input type="color" id="text-color" value="#000000" class="w-full h-8 cursor-pointer"></div>
            <div><label class="text-xs text-gray-500">縁取色</label><input type="color" id="stroke-color" value="#000000" class="w-full h-8 cursor-pointer"></div>
          </div>
          
          <div class="flex gap-4 items-center">
            <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="font-bold" checked> 太字</label>
            <div class="flex-1"><label class="text-xs text-gray-500 block">縁取幅</label><input type="range" id="stroke-width" min="0" max="20" value="4" class="w-full"></div>
          </div>
          
          <select id="font-select" onchange="draw(currentTime)" class="w-full p-2 rounded border border-gray-800 cursor-pointer">
            <option value='"Hiragino Sans", "Yu Gothic", "MS PGothic", sans-serif'>ゴシック</option>
            <option value='"Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif'>明朝</option>
            <option value='"美咲ゴシック", monospace'>美咲ゴシック</option>
            <option value="'Noto Sans JP', sans-serif">Noto Sans JP</option>
            <option value="'Kaisei Decol', serif">Kaisei Decol</option>
            <option value="'DotGothic16', sans-serif">DotGothic16</option>
            <option value="'Dela Gothic One', cursive">Dela Gothic One</option>
            <option value="'Potta One', cursive">Potta One</option>
            <option value="'Hachi Maru Pop', cursive">Hachi Maru Pop</option>
          </select>
          
          <button onclick="processLyrics()" class="w-full bg-gray-100/10 hover:bg-gray-100/20 py-2 rounded font-bold">設定を適用・更新</button>
          
          <div class="flex gap-2">
            <button id="play-btn" onclick="togglePlay()" class="flex-1 bg-gray-100/10 hover:bg-gray-100/20 py-2 rounded font-bold">再生</button>
          </div>
        </div>

        <div class="space-y-3 p-4 bg-gray-100/10 rounded border border-gray-800 text-sm">
          <div class="font-bold text-gray-200">同期再生設定</div>
          <div class="flex flex-wrap gap-4 items-end">
            <label class="flex items-center gap-2 text-sm text-gray-200">
              <input type="radio" name="playbackMode" value="url" checked onchange="onPlaybackModeChange('url')"> URLから再生
            </label>
            <label class="flex items-center gap-2 text-sm text-gray-200">
              <input type="radio" name="playbackMode" value="file" onchange="onPlaybackModeChange('file')"> 動画/音楽ファイル
            </label>
            <div class="flex-1 min-w-[280px]">
              <label class="block text-xs font-bold mb-1 text-gray-500">コンテンツ</label>
              <input type="text" id="media-url-input" value="https://www.youtube.com/watch?v=M5GSji71eUY" class="w-full bg-gray-100/10 p-2 rounded border border-gray-800" oninput="onMediaUrlChange(this.value)">
              <input type="file" id="media-file-input" accept="audio/*,video/*" class="w-full rounded bg-gray-100/10 text-sm text-gray-200" style="display:none" onchange="onFileChange(this)">
            </div>
          </div>
          <div class="flex flex-wrap gap-2 items-center">
            <button id="sync-play-btn" onclick="handleSyncPlay()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded font-bold">同期再生</button>
            <div class="flex items-center gap-1">
              <label class="text-xs text-gray-400 whitespace-nowrap">シーク</label>
              <input type="number" id="seek-seconds" min="0" step="1" value="45" class="w-16 p-1 border border-gray-800 bg-gray-100/10 rounded text-white text-sm" oninput="onSeekChange(this.value)">
              <span class="text-xs text-gray-400">秒</span>
            </div>
            <div class="flex items-center gap-1">
              <label class="text-xs text-gray-400 whitespace-nowrap">遅延開始</label>
              <input type="number" id="synced-delay" min="0" step="0.1" value="0" class="w-16 p-1 border border-gray-800 bg-gray-100/10 rounded text-white text-sm" oninput="onDelayChange(this.value)">
              <span class="text-xs text-gray-400">秒</span>
            </div>
            <span class="text-sm text-gray-400">コンテンツを<span id="seek-label">45</span>秒から再生し、<span id="delay-label">0.00</span>秒後に同期を開始します。</span>
          </div>
        </div>
      </div>
      
      <div class="lg:col-span-3 space-y-4">
        <div class="relative cursor-pointer" id="progress-container">
            <canvas id="preview-canvas" class="w-full rounded border border-gray-800"></canvas>
            <div class="absolute bottom-0 left-0 w-full h-3 bg-gray-900 border-t border-gray-700">
                <div id="progress-bar" class="h-full bg-blue-600 w-0"></div>
            </div>
        </div>
        <div id="media-player-area" class="max-w-sm mx-auto rounded border border-gray-800 bg-black">
          <div id="youtube-container" class="w-full aspect-video bg-black"></div>
          <video id="video-player" class="w-full bg-black" controls style="display:none"></video>
          <audio id="audio-player" class="w-full" controls style="display:none"></audio>
          <div id="media-placeholder" class="text-sm text-gray-400 p-4 text-center">URLまたはファイルを指定するとプレビューが表示されます。</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    let lyrics = [], bgMode = '#00FF00', currentTime = 0, animId = null, isPlaying = false, currentScrollY = 0, totalDuration = 0, lastTime = 0;
    let youtubeApiReady = false, youtubePlayer = null, youtubePlayerReady = false, creatingYouTube = false;
    let playbackMode = 'url', youtubeUrl = 'https://www.youtube.com/watch?v=M5GSji71eUY', selectedFile = null, fileUrl = '', fileType = 'audio', syncedDelay = 0, seekSeconds = 45;

    if (typeof YT !== 'undefined' && YT.Player) {
      youtubeApiReady = true;
    } else if (!document.querySelector('script[src*="youtube.com/iframe_api"]')) {
      window.onYouTubeIframeAPIReady = () => { youtubeApiReady = true; };
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.body.appendChild(tag);
    }

    function parseYouTubeId(url) {
      try {
        const parsed = new URL(url);
        if (parsed.hostname.includes('youtu.be')) return parsed.pathname.slice(1);
        if (parsed.hostname.includes('youtube.com')) return parsed.searchParams.get('v');
        return null;
      } catch { return null; }
    }

    function setBgMode(m) { bgMode = m === 'blue' ? '#0000FF' : m === 'green' ? '#00FF00' : '#000'; draw(currentTime); }

    function processLyrics() {
      const input = document.getElementById('lyric-input').value;
      const rows = parseInt(document.getElementById('display-rows').value) || 2;
      const font = document.getElementById('font-select').value;
      const drawFontSize = canvas.height / (rows * 2);
      ctx.font = drawFontSize + 'px ' + font;
      lyrics = input.split('\n')
        .filter(l => l.trim() && !l.trim().startsWith('#'))
        .map(l => {
          const text = l.split(']')[1] || l;
          const match = l.match(/\[(\d+):(\d+\.\d+)\]/);
          const time = match ? parseInt(match[1])*60 + parseFloat(match[2]) : 0;
          const m = ctx.measureText(text.trim());
          return { time, text: text.trim(), scale: Math.min(1, (canvas.width * 0.64) / (m.width || 400)) };
        }).sort((a, b) => a.time - b.time);
      totalDuration = lyrics.length > 0 ? lyrics[lyrics.length - 1].time + 5 : 60;
      draw(0);
    }

    function draw(time) {
      currentTime = time;
      ctx.fillStyle = bgMode; ctx.fillRect(0, 0, canvas.width, canvas.height);
      const rows = parseInt(document.getElementById('display-rows').value) || 2;
      const ease = parseFloat(document.getElementById('ease-strength').value) || 0.5;
      const textColor = document.getElementById('text-color').value;
      const strokeColor = document.getElementById('stroke-color').value;
      const isBold = document.getElementById('font-bold').checked;
      const strokeWidth = document.getElementById('stroke-width').value;
      
      progressBar.style.width = Math.min(100, (time / Math.max(totalDuration, 1)) * 100) + '%';
      
      let targetIdx = lyrics.findIndex((l, i) => time >= l.time && (!lyrics[i+1] || time < lyrics[i+1].time));
      if (targetIdx === -1) targetIdx = 0;
      const targetY = Math.max(0, targetIdx - 1) * (canvas.height / rows);
      currentScrollY += (targetY - currentScrollY) * (1 - ease) * 0.2;

      ctx.fillStyle = textColor;
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = strokeWidth;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.font = (isBold ? 'bold ' : '') + (canvas.height / (rows * 2)) + 'px ' + document.getElementById('font-select').value;
      
      lyrics.forEach((l, i) => {
        const y = (i * (canvas.height / rows)) - currentScrollY + (canvas.height / 2.5);
        ctx.save();
        ctx.scale(l.scale, 1);
        if (strokeWidth > 0) ctx.strokeText(l.text, (canvas.width / 2) / l.scale, y);
        ctx.fillText(l.text, (canvas.width / 2) / l.scale, y);
        ctx.restore();
      });
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('play-btn').innerText = isPlaying ? '停止' : '再生';
      if (isPlaying) {
        lastTime = Date.now();
        const tick = () => {
          if (!isPlaying) return;
          const now = Date.now();
          currentTime += (now - lastTime) / 1000;
          lastTime = now;
          draw(currentTime);
          animId = requestAnimationFrame(tick);
        };
        tick();
      } else cancelAnimationFrame(animId);
    }

    progressContainer.onclick = (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      currentTime = pos * Math.max(totalDuration, 1);
      draw(currentTime);
      if (youtubePlayer && youtubePlayerReady) youtubePlayer.seekTo(currentTime);
      const mediaEl = fileType === 'video' ? document.getElementById('video-player') : document.getElementById('audio-player');
      if (mediaEl && mediaEl.readyState > 0) mediaEl.currentTime = currentTime;
    };

    function showMediaPlayer(isYouTube) {
      document.getElementById('youtube-container').style.display = isYouTube ? '' : 'none';
      document.getElementById('video-player').style.display = !isYouTube && fileType === 'video' ? '' : 'none';
      document.getElementById('audio-player').style.display = !isYouTube && fileType === 'audio' ? '' : 'none';
      document.getElementById('media-placeholder').style.display = (!isYouTube && !fileUrl) ? '' : 'none';
    }

    function onPlaybackModeChange(mode) {
      playbackMode = mode;
      document.getElementById('media-url-input').style.display = mode === 'url' ? '' : 'none';
      document.getElementById('media-file-input').style.display = mode === 'file' ? '' : 'none';
      if (mode === 'file' && youtubePlayer) {
        try { youtubePlayer.destroy(); } catch(e) {} youtubePlayer = null; youtubePlayerReady = false; creatingYouTube = false;
      }
      updateMediaDisplay();
    }

    function onMediaUrlChange(value) {
      youtubeUrl = value;
      if (youtubePlayer) { try { youtubePlayer.destroy(); } catch(e) {} youtubePlayer = null; youtubePlayerReady = false; }
      creatingYouTube = false;
      document.getElementById('youtube-container').innerHTML = '';
      updateMediaDisplay();
    }

    function onFileChange(input) {
      const file = input.files?.[0] || null;
      selectedFile = file;
      if (fileUrl) URL.revokeObjectURL(fileUrl);
      if (file) {
        fileUrl = URL.createObjectURL(file);
        fileType = file.type.startsWith('video/') ? 'video' : 'audio';
        const el = fileType === 'video' ? document.getElementById('video-player') : document.getElementById('audio-player');
        el.src = fileUrl; el.load();
      } else { fileUrl = ''; }
      updateMediaDisplay();
    }

    function onSeekChange(value) {
      seekSeconds = parseFloat(value) || 0;
      document.getElementById('seek-label').textContent = seekSeconds;
    }

    function onDelayChange(value) {
      syncedDelay = parseFloat(value) || 0;
      document.getElementById('delay-label').textContent = syncedDelay.toFixed(2);
    }

    function updateMediaDisplay() {
      const isYouTube = playbackMode === 'url' && parseYouTubeId(youtubeUrl);
      if (isYouTube) {
        showMediaPlayer(true);
        if (youtubeApiReady) ensureYouTubePlayer();
      } else if (fileUrl) {
        showMediaPlayer(false);
      } else {
        showMediaPlayer(false);
      }
    }

    function ensureYouTubePlayer() {
      return new Promise((resolve) => {
        const videoId = parseYouTubeId(youtubeUrl);
        if (!videoId) { resolve(false); return; }
        if (youtubePlayer && youtubePlayerReady) { resolve(true); return; }
        if (creatingYouTube) {
          const check = () => {
            if (creatingYouTube) { setTimeout(check, 100); return; }
            resolve(!!(youtubePlayer && youtubePlayerReady));
          };
          check(); return;
        }
        if (youtubePlayer) { try { youtubePlayer.destroy(); } catch(e) {} youtubePlayer = null; }
        document.getElementById('youtube-container').innerHTML = '';
        creatingYouTube = true;
        const tryCreate = () => {
          if (!youtubeApiReady || typeof YT === 'undefined') { setTimeout(tryCreate, 100); return; }
          youtubePlayer = new YT.Player('youtube-container', {
            width: '100%', height: '100%', videoId,
            playerVars: { rel: 0, modestbranding: 1, controls: 1, disablekb: 1 },
            events: {
              onReady: () => { youtubePlayerReady = true; creatingYouTube = false; resolve(true); },
              onStateChange: () => {},
            },
          });
        };
        if (youtubeApiReady && typeof YT !== 'undefined') { tryCreate(); }
        else {
          const wait = () => {
            if (youtubeApiReady && typeof YT !== 'undefined') { tryCreate(); }
            else { setTimeout(wait, 100); }
          };
          wait();
        }
      });
    }

    async function seekAndPlayMedia() {
      const isYouTube = playbackMode === 'url' && parseYouTubeId(youtubeUrl);
      if (isYouTube) {
        if (!youtubePlayerReady || !youtubePlayer) return false;
        try { youtubePlayer.seekTo(seekSeconds, true); youtubePlayer.playVideo(); return true; }
        catch (e) { console.error('YouTube play error', e); return false; }
      }
      const mediaEl = fileType === 'video' ? document.getElementById('video-player') : document.getElementById('audio-player');
      if (!mediaEl || !fileUrl) return false;
      try { mediaEl.currentTime = seekSeconds; await mediaEl.play(); return true; }
      catch (e) { console.error('Media play error', e); return false; }
    }

    async function handleSyncPlay() {
      if (animId) cancelAnimationFrame(animId);
      isPlaying = false;
      document.getElementById('play-btn').innerText = '再生';
      const isYouTube = playbackMode === 'url' && parseYouTubeId(youtubeUrl);
      let ready = false;
      if (isYouTube) ready = await ensureYouTubePlayer();
      else ready = !!fileUrl;
      if (!ready) return;
      const started = await seekAndPlayMedia();
      if (!started) return;
      setTimeout(() => {
        isPlaying = true;
        document.getElementById('play-btn').innerText = '停止';
        const syncLoop = () => {
          if (!isPlaying) return;
          let t;
          if (isYouTube && youtubePlayer && youtubePlayerReady) {
            try { t = youtubePlayer.getCurrentTime(); } catch(e) { t = 0; }
          } else {
            const mediaEl = fileType === 'video' ? document.getElementById('video-player') : document.getElementById('audio-player');
            t = mediaEl ? mediaEl.currentTime : 0;
          }
          draw(Math.max(0, t - seekSeconds));
          animId = requestAnimationFrame(syncLoop);
        };
        syncLoop();
      }, Math.round(syncedDelay * 1000));
    }

    window.onload = () => { canvas.width = 1280; canvas.height = 720; processLyrics(); lucide.createIcons(); updateMediaDisplay(); };
  </script>
</body>
</html>
